[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phylab"
version = "0.1.0"
description = "Data analysis tools for the University of Auckland undergraduate physics lab courses."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sean Richards" },
]
keywords = ["physics", "teaching", "curve-fitting", "pendulum", "chaos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "flake8>=6",
]

[project.urls]
Homepage = "https://ordinarystarman.com"

[tool.setuptools.packages.find]
where = ["phylab"]
